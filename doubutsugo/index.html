<title>どうぶつ語ゲーム</title>
<style>

  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}

    background:linear-gradient(160deg,var(--bg1) 0%,var(--bg2) 100%);

  }
  #app{
    height:100vh;height:100dvh;display:flex;flex-direction:column;
    padding:0 16px calc(14px + env(safe-area-inset-bottom)) 16px;
    max-width:560px;margin:0 auto;
  }
  .screen{flex:1;display:flex;flex-direction:column;min-height:0}
  .hidden{display:none !important}

  .btn{
    display:flex;align-items:center;justify-content:center;gap:10px;
    width:100%;border:none;border-radius:16px;
    font-family:inherit;font-weight:800;color:#fff;
    cursor:pointer;box-shadow:var(--shadow);
    transition:transform .06s ease, filter .06s ease;
  }
  .btn:active{transform:translateY(3px);box-shadow:none;filter:brightness(.95)}
  .btn-mode{min-height:88px;font-size:1.5rem;background:var(--accent);border-bottom:4px solid #37805a;flex-direction:column;gap:2px}
  .btn-mode small{font-size:.62em;font-weight:700;opacity:.9}
  .btn-mode.adv{background:#7b5ea7;border-bottom-color:#5f4785}
  .btn-next{min-height:76px;font-size:1.45rem;background:var(--accent);border-bottom:4px solid #37805a}
  .btn-pass{min-height:54px;font-size:1.1rem;background:var(--pass);border-bottom:4px solid var(--pass-dark)}
  .btn-sub{min-height:60px;font-size:1.15rem;background:#fff;color:var(--ink);border:2px solid var(--ink-sub);box-shadow:none}
  .btn-sub:active{transform:translateY(2px)}

  /* ---------- スタート ---------- */
  #home{justify-content:center;align-items:stretch;text-align:center;gap:18px;padding-bottom:10px}
  .home-title{font-size:clamp(1.9rem,8.5vw,2.6rem);font-weight:900;line-height:1.3}
  .home-title small{display:block;font-size:.42em;color:var(--accent);margin-bottom:8px;letter-spacing:.12em}
  .home-lead{
    background:var(--card);border-radius:18px;padding:16px 16px;
    font-size:1rem;line-height:1.85;box-shadow:0 3px 12px rgba(0,0,0,.06);text-align:left;
  }
  .home-lead b{color:var(--accent)}
  .home-note{font-size:.82rem;color:var(--ink-sub);line-height:1.7}

  /* ---------- ヘッダー ---------- */
  .bar{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 0 8px 0}
  .home-btn{
    flex:0 0 auto;width:38px;height:38px;border:none;border-radius:12px;
    background:rgba(255,255,255,.85);color:var(--ink-sub);
    font-size:1.1rem;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.08);
  }
  .home-btn:active{transform:translateY(2px)}
  .status{flex:1;display:flex;justify-content:flex-end;align-items:center;gap:12px;font-weight:800;font-size:1.05rem}
  .mode-tag{background:var(--accent);color:#fff;border-radius:999px;padding:3px 12px;font-size:.85rem}
  .mode-tag.adv{background:#7b5ea7}

  /* ---------- 問題 ---------- */
  .qwrap{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;min-height:0;overflow-y:auto;padding:4px 0}
  .label{font-size:.85rem;font-weight:800;color:var(--ink-sub);letter-spacing:.08em;margin-bottom:6px}
  .panel{background:var(--card);border-radius:20px;padding:18px 16px;text-align:center;box-shadow:0 3px 12px rgba(0,0,0,.06)}
  .genre{font-size:clamp(1.3rem,5.8vw,1.8rem);font-weight:900;line-height:1.5}
  .animal-name{font-size:clamp(1.6rem,7vw,2.1rem);font-weight:900;color:var(--accent)}
  .animal-sound{margin-top:4px;font-size:1.05rem;font-weight:700;color:var(--ink-sub)}
  .answer{font-size:clamp(1.7rem,7.5vw,2.2rem);font-weight:900;color:var(--answer);line-height:1.4}
  .panel.answer-panel{border:3px dashed var(--answer);background:#fff8f2}
  .selfmade{font-size:1.15rem;font-weight:800;color:#7b5ea7;line-height:1.6}
  .actions{display:flex;flex-direction:column;gap:10px;padding-top:8px}

  /* ---------- 終了 ---------- */
  #end{justify-content:center;align-items:stretch;text-align:center;gap:20px}
  .end-title{font-size:clamp(1.8rem,8vw,2.4rem);font-weight:900;line-height:1.4}
  .end-msg{background:var(--card);border-radius:18px;padding:18px 16px;font-size:1.05rem;line-height:1.8;font-weight:700;box-shadow:0 3px 12px rgba(0,0,0,.06)}
</style>
</head>
<body>
<div id="app">

  <!-- ===== スタート画面 ===== -->
  <section id="home" class="screen">
    <h1 class="home-title"><small>ANIMAL TALK</small>どうぶつ語ゲーム</h1>
    <p class="home-lead">
      親はジャンルを<b>読み上げて</b>、指定された<b>動物の鳴き声だけ</b>で答えを伝える。<br>
      みんなはそれが何かを当てる。<br>
      1人5問。終わったら次の人に交代！
    </p>
    <button id="beginnerBtn" class="btn btn-mode">初級<small>答えは画面に出ます</small></button>
    <button id="advancedBtn" class="btn btn-mode adv">上級<small>答えは自分で考えます</small></button>
    <p class="home-note">言葉・答えの一部・直接のヒントを口に出すのはNG<br>鳴き声の長さ・回数・テンポ・抑揚は自由</p>
  </section>

  <!-- ===== 問題画面 ===== -->
  <section id="game" class="screen hidden">
    <div class="bar">
      <button id="homeBtn" class="home-btn" aria-label="モード選択へ戻る">⌂</button>
      <div class="status">
        <span class="mode-tag" id="modeTag">初級</span>
        <span id="progress">1 / 5問</span>
      </div>
    </div>

    <div class="qwrap">
      <div class="panel">
        <div class="label">ジャンル（読み上げる）</div>
        <div class="genre" id="genre"></div>
      </div>

      <div class="panel">
        <div class="label">この動物の鳴き声だけで</div>
        <div class="animal-name" id="animalName"></div>
        <div class="animal-sound" id="animalSound"></div>
      </div>

      <div class="panel answer-panel" id="answerPanel">
        <div class="label">答え</div>
        <div class="answer" id="answer"></div>
      </div>

      <div class="panel hidden" id="selfPanel">
        <div class="selfmade">答えは自分で考えてください</div>
      </div>
    </div>

    <div class="actions">
      <button id="nextBtn" class="btn btn-next">次の問題</button>
      <button id="passBtn" class="btn btn-pass">パス（別の問題にする）</button>
    </div>
  </section>

  <!-- ===== 終了画面 ===== -->
  <section id="end" class="screen hidden">
    <div class="end-title">5問終了！<br>次の親に交代！</div>
    <p class="end-msg">正解した数は<br>各自で数えておいてください</p>
    <button id="againBtn" class="btn btn-next">次の親スタート</button>
    <button id="backModeBtn" class="btn btn-sub">モード選択へ戻る</button>
  </section>

</div>

/* =========================================================================
   ゲーム本体
   ========================================================================= */
const TOTAL_Q = 5;
const $ = (id) => document.getElementById(id);

let state = null;

function startGame(mode) {
  state = {
    mode: mode,                 // 'beginner' | 'advanced'
    step: 0,
    usedQ: [],                  // この5問で出した問題のindex
    usedAnimals: [],            // 確定した問題で使った動物のindex
    current: null
  };
  showScreen('game');
  nextQuestion();
}

function pool() {
  return state.mode === 'beginner' ? BEGINNER : ADVANCED;
}

// 未出題の問題からランダムに1問
function pickQuestion() {
  const p = pool();
  const rest = p.map((_, i) => i).filter(i => !state.usedQ.includes(i));
  if (rest.length === 0) return null;
  const idx = rest[Math.floor(Math.random() * rest.length)];
  state.usedQ.push(idx);
  return idx;
}

// 確定済みの問題で使った動物とは重ならないようにランダムに1匹
function pickAnimal() {
  const rest = ANIMALS.map((_, i) => i).filter(i => !state.usedAnimals.includes(i));
  const from = rest.length ? rest : ANIMALS.map((_, i) => i);
  return from[Math.floor(Math.random() * from.length)];
}

function nextQuestion() {
  const q = pickQuestion();
  if (q === null) { showScreen('end'); return; }  // 問題を出しきった場合（通常は起こらない）
  state.current = { q: q, animal: pickAnimal() };
  render();
}

function render() {
  const beginner = state.mode === 'beginner';
  const entry = pool()[state.current.q];
  const animal = ANIMALS[state.current.animal];

  $('modeTag').textContent = beginner ? '初級' : '上級';
  $('modeTag').classList.toggle('adv', !beginner);
  $('progress').textContent = (state.step + 1) + ' / ' + TOTAL_Q + '問';

  $('genre').textContent = beginner ? entry[0] : entry;
  $('animalName').textContent = animal[0];
  $('animalSound').textContent = '「' + animal[1] + '」';

  $('answerPanel').classList.toggle('hidden', !beginner);
  $('selfPanel').classList.toggle('hidden', beginner);
  if (beginner) $('answer').textContent = entry[1];
}

// パス：問題数を消費せず、同じモードの未出題の別問題へ差し替える
function pass() {
  const q = pickQuestion();
  if (q === null) { advance(); return; }          // 出しきったときだけ次へ進む
  state.current = { q: q, animal: pickAnimal() };
  render();
}

function advance() {
  // いま表示している動物を「使用済み」として確定する
  state.usedAnimals.push(state.current.animal);
  state.step++;
  if (state.step >= TOTAL_Q) {
    showScreen('end');
  } else {
    nextQuestion();
  }
}

function showScreen(name) {
  ['home', 'game', 'end'].forEach(s => $(s).classList.toggle('hidden', s !== name));
}

// ---- イベント ----
$('beginnerBtn').addEventListener('click', () => startGame('beginner'));
$('advancedBtn').addEventListener('click', () => startGame('advanced'));
$('nextBtn').addEventListener('click', advance);
$('passBtn').addEventListener('click', pass);
$('homeBtn').addEventListener('click', () => showScreen('home'));
$('againBtn').addEventListener('click', () => startGame(state.mode));
$('backModeBtn').addEventListener('click', () => showScreen('home'));
