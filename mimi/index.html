<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c94f7c">
<title>耳パズル 共通項を探せ</title>
<style>
  :root{
    --bg1:#fff0f5;
    --bg2:#f9dbe6;
    --ink:#3d2230;
    --ink-sub:#8f6b7b;
    --card:#ffffff;
    --accent:#c94f7c;
    --accent-dark:#a13a62;
    --ex:#3f7fb8;
    --pass:#8d8378;
    --pass-dark:#6d645b;
    --ok:#1fa971;
    --shadow:0 4px 0 rgba(0,0,0,.12);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:var(--ink);
    background:linear-gradient(160deg,var(--bg1) 0%,var(--bg2) 100%);
    overflow:hidden;touch-action:manipulation;-webkit-text-size-adjust:100%;
  }
  #app{
    height:100vh;height:100dvh;display:flex;flex-direction:column;
    padding:0 16px calc(14px + env(safe-area-inset-bottom)) 16px;
    max-width:560px;margin:0 auto;
  }
  .screen{flex:1;display:flex;flex-direction:column;min-height:0}
  .hidden{display:none !important}

  .btn{
    display:flex;align-items:center;justify-content:center;gap:10px;
    width:100%;border:none;border-radius:16px;
    font-family:inherit;font-weight:800;color:#fff;
    cursor:pointer;box-shadow:var(--shadow);
    transition:transform .06s ease, filter .06s ease;
  }
  .btn:active{transform:translateY(3px);box-shadow:none;filter:brightness(.95)}
  .btn:disabled{opacity:.5;cursor:default}
  .btn-start{min-height:80px;font-size:1.5rem;background:var(--accent);border-bottom:4px solid var(--accent-dark)}
  .btn-next{min-height:76px;font-size:1.4rem;background:var(--accent);border-bottom:4px solid var(--accent-dark)}
  .btn-pass{min-height:54px;font-size:1.1rem;background:var(--pass);border-bottom:4px solid var(--pass-dark)}

  /* ---------- スタート ---------- */
  #home{justify-content:center;align-items:stretch;text-align:center;gap:16px;padding-bottom:10px}
  .home-title{font-size:clamp(1.8rem,8vw,2.5rem);font-weight:900;line-height:1.3}
  .home-title small{display:block;font-size:.42em;color:var(--accent);margin-bottom:8px;letter-spacing:.12em}
  .home-lead{
    background:var(--card);border-radius:18px;padding:16px 16px;
    font-size:1rem;line-height:1.85;box-shadow:0 3px 12px rgba(0,0,0,.06);text-align:left;
  }
  .home-lead b{color:var(--accent)}
  .home-note{font-size:.82rem;color:var(--ink-sub);line-height:1.7}
  .room{background:var(--card);border-radius:18px;padding:14px 16px;box-shadow:0 3px 12px rgba(0,0,0,.06)}
  .room label{display:block;font-size:.85rem;font-weight:800;color:var(--ink-sub);letter-spacing:.08em;margin-bottom:8px}
  .room input{
    width:100%;border:3px solid var(--accent);border-radius:14px;padding:10px;
    font-family:inherit;font-size:2.2rem;font-weight:900;text-align:center;letter-spacing:.4em;
    color:var(--ink);text-transform:uppercase;outline:none;
  }
  .room .hint{font-size:.85rem;color:var(--ink-sub);margin-top:8px;line-height:1.6}

  /* ---------- ヘッダー ---------- */
  .bar{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 0 8px 0}
  .home-btn{
    flex:0 0 auto;width:38px;height:38px;border:none;border-radius:12px;
    background:rgba(255,255,255,.85);color:var(--ink-sub);
    font-size:1.1rem;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.08);
  }
  .home-btn:active{transform:translateY(2px)}
  .status{flex:1;display:flex;justify-content:flex-end;align-items:center;gap:10px;font-weight:800;font-size:1rem}
  .room-tag{background:var(--accent);color:#fff;border-radius:999px;padding:3px 12px;font-size:.9rem;letter-spacing:.15em}
  .dot{width:12px;height:12px;border-radius:50%;background:#bbb;flex:0 0 auto}
  .dot.on{background:var(--ok)}
  .dot.err{background:#e8604c}

  /* ---------- 問題 ---------- */
  .qwrap{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;min-height:0;overflow-y:auto;padding:4px 0}
  .label{font-size:.85rem;font-weight:800;color:var(--ink-sub);letter-spacing:.08em;margin-bottom:6px}
  .panel{background:var(--card);border-radius:20px;padding:20px 16px;text-align:center;box-shadow:0 3px 12px rgba(0,0,0,.06)}
  .cat{display:inline-block;background:var(--accent);color:#fff;border-radius:999px;padding:3px 12px;font-size:.85rem;font-weight:800;margin-bottom:10px}
  .cat.d{background:#7b5ea7}
  .question{font-size:clamp(1.45rem,6.4vw,2rem);font-weight:900;line-height:1.45}
  .panel.ex-panel{border:3px dashed var(--ex);background:#f3f8fd}
  .examples{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
  .ex{background:#fff;border:2px solid var(--ex);border-radius:14px;padding:10px 16px;font-size:clamp(1.15rem,5vw,1.5rem);font-weight:900;color:var(--ex)}
  .selfmade{font-size:1.1rem;font-weight:800;color:#7b5ea7;line-height:1.6}
  .actions{display:flex;flex-direction:column;gap:10px;padding-top:8px}
  .sync-note{text-align:center;font-size:.8rem;color:var(--ink-sub);font-weight:700}
  .yuma{height:92px;width:auto;align-self:center;margin:-2px auto 0;filter:drop-shadow(0 3px 4px rgba(0,0,0,.15));pointer-events:none}
  .yuma-mini{height:40px;width:auto;flex:0 0 auto;filter:drop-shadow(0 2px 2px rgba(0,0,0,.15));pointer-events:none}
  .yuma-mini.end{height:72px;align-self:center}
  /* ---------- お題の評価 ---------- */
  .rate{display:flex;gap:10px;justify-content:center}
  .rate button{flex:1;max-width:190px;min-height:46px;border:2px solid #ddd;border-radius:14px;background:#fff;font-family:inherit;font-size:1rem;font-weight:800;color:var(--ink);cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.08);transition:transform .06s ease,background .15s ease}
  .rate button:active{transform:translateY(2px);box-shadow:none}
  .rate button.good{border-color:#1fa971;color:#147d53}
  .rate button.bad{border-color:#e8604c;color:#c04434}
  .rate button .n{display:inline-block;min-width:1.6em;margin-left:6px;background:#f2f2f2;border-radius:999px;padding:1px 8px;font-size:.85em}
  .rate button.flash{background:#fff4d6}
  .btn-rate{min-height:50px;font-size:1.05rem;background:#fff;color:var(--ink-sub);border:2px solid var(--ink-sub);box-shadow:none}
  .btn-rate:active{transform:translateY(2px)}
  #rate{gap:12px;padding-top:calc(14px + env(safe-area-inset-top))}
  .rate-title{font-size:1.35rem;font-weight:900;text-align:center}
  .rate-list{flex:1;min-height:0;overflow-y:auto;background:var(--card);border-radius:18px;padding:6px 14px;box-shadow:0 3px 12px rgba(0,0,0,.06)}
  .rate-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #eee;font-weight:700;font-size:.95rem;line-height:1.4}
  .rate-row:last-child{border-bottom:none}
  .rate-row .cnt{flex:0 0 auto;white-space:nowrap;font-weight:900}
  .rate-row .cnt .g{color:#147d53}
  .rate-row .cnt .b{color:#c04434;margin-left:8px}
  .rate-empty{text-align:center;color:var(--ink-sub);padding:30px 0;font-weight:700}
  .rate-actions{display:flex;flex-direction:column;gap:8px}
</style>
</head>
<body>
<div id="app">

  <!-- ===== スタート画面 ===== -->
  <section id="home" class="screen">
    <h1 class="home-title"><small>EAR PUZZLE</small>耳パズル<br>共通項を探せ</h1>
    <p class="home-lead">
      ヒント役2人は<b>同じ部屋コード</b>で入って、同じお題を見る。<br>
      交互に<b>お題に当てはまる言葉</b>を言っていき、回答者は共通の法則を当てる。<br>
      誰かが「次のお題」を押すと<b>全員の画面が切り替わる</b>。
    </p>
    <div class="room">
      <label>部屋コード（全員同じにする）</label>
      <input id="roomInput" maxlength="2" autocomplete="off" autocapitalize="characters" inputmode="latin">
      <div class="hint">最初の人はそのまま入る。他の人はこのコードを打って入る</div>
    </div>

  ['B', '毎日経験するのに記憶が存在しないもの', ['寝落ちの瞬間', '生まれた瞬間', 'まばたき中の暗闇']],

  // --- C: 追加の盲点系 ---
  ['C', '家にあるけど毎日は使わないもの', ['体温計', '救急箱', 'ミシン']],
  ['C', '買った瞬間から価値が減っていくもの', ['新車', '花束', 'チケット']],
  ['C', '誰も見ていないときにしか起きないこと', ['冷蔵庫の中の消灯', '猫の悪さ', '留守中の宅配']],

  // --- D: アナタ系（ヒント役が自分の答えを言う） ---
  ['D', 'アナタの好きな食べ物', []],
  ['D', 'アナタの好きな動物', []],
  ['D', 'アナタが好きなひらがな', []],
  ['D', 'アナタの好きな色', []],
  ['D', 'アナタがやってみたいこと', []],
  ['D', 'アナタが週末にしたいこと', []],
  ['D', 'アナタが得意になりたいこと', []],
  ['D', 'アナタがやめたいこと', []],
  ['D', 'アナタが言われたい言葉', []]
];

/* =========================================================================
   同期（ntfy.sh の公開トピックを部屋コードで共有）
   -------------------------------------------------------------------------
   ・送るのは {q: お題index, n: 何問目, t: 時刻} だけ
   ・受け取った側は t が新しければ画面を差し替える
   ========================================================================= */
const NTFY = 'https://ntfy.sh/';
const TOPIC_PREFIX = 'mimipuzzle-';
const CODE_CHARS = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const $ = (id) => document.getElementById(id);

let state = null;
let es = null;

function randomCode() {
  let s = '';
  for (let i = 0; i < 2; i++) s += CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)];
  return s;
}

function topic() { return TOPIC_PREFIX + state.room.toLowerCase(); }

function setDot(cls, note) {
  $('dot').className = 'dot ' + cls;
  $('syncNote').textContent = note;
}

async function joinRoom(code) {
  state = { room: code, q: null, n: 0, t: 0, used: [] };
  $('roomTag').textContent = code;
  showScreen('game');
  setDot('', '接続中…');

  // 直近の状態を取りに行く（12時間以内の最後のメッセージ）
  let latest = null;
  try {
    const res = await fetch(NTFY + topic() + '/json?poll=1&since=12h');
    const text = await res.text();
    text.trim().split('\n').forEach(line => {
      if (!line) return;
      try {
        const m = JSON.parse(line);
        if (m.event === 'message') {
          const d = JSON.parse(m.message);
          if (!latest || d.t > latest.t) latest = d;
        }
      } catch (e) {}
    });
  } catch (e) {}

  subscribe();

  if (latest) {
    apply(latest);
  } else {
    // 部屋に誰もいなければ最初のお題を出す
    publishNext();
  }
}

function subscribe() {
  if (es) es.close();
  es = new EventSource(NTFY + topic() + '/sse');
  es.onopen = () => setDot('on', '同期中：誰かが押すと全員の画面が変わります');
  es.onerror = () => setDot('err', '接続が切れました。再接続中…');
  es.onmessage = (ev) => {
    try {
      const d = JSON.parse(JSON.parse(ev.data).message);
      apply(d);
    } catch (e) {}
  };
}

function apply(d) {
  if (typeof d.q !== 'number' || d.t <= state.t) return;
  state.q = d.q; state.n = d.n; state.t = d.t;
  if (!state.used.includes(d.q)) state.used.push(d.q);
  render();
}

function pickQuestion() {
  let rest = QUESTIONS.map((_, i) => i).filter(i => !state.used.includes(i));
  if (rest.length === 0) {
    state.used = [];
    rest = QUESTIONS.map((_, i) => i).filter(i => i !== state.q);
  }
  return rest[Math.floor(Math.random() * rest.length)];
}

async function publish(d) {
  apply(d);  // 自分の画面は先に切り替える
  try {
    await fetch(NTFY + topic(), { method: 'POST', body: JSON.stringify(d) });
  } catch (e) {
    setDot('err', '送信に失敗しました。電波を確認してください');
  }
}

function publishNext() {
  publish({ q: pickQuestion(), n: state.n + 1, t: Date.now() });
}

function publishPass() {
  publish({ q: pickQuestion(), n: state.n, t: Date.now() });
}

function render() {
  const e = QUESTIONS[state.q];
  const isD = e[0] === 'D';
  $('cat').textContent = CAT_NAME[e[0]];
  $('cat').classList.toggle('d', isD);
  $('question').textContent = e[1];
  $('progress').textContent = state.n + '問目';
  $('exPanel').classList.toggle('hidden', isD);
  $('selfPanel').classList.toggle('hidden', !isD);
  $('examples').innerHTML = e[2].map(x => '<span class="ex">' + x + '</span>').join('');
}

function leaveRoom() {
  if (es) { es.close(); es = null; }
  showScreen('home');
}

function showScreen(name) {
  ['home', 'game', 'rate'].forEach(s => $(s).classList.toggle('hidden', s !== name));
}

// スマホがスリープから戻ったら最新状態を取り直す
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && state && !$('game').classList.contains('hidden')) {
    joinRoom(state.room);
  }
});

// ---- イベント ----
$('roomInput').value = randomCode();
$('startBtn').addEventListener('click', () => {
  const code = $('roomInput').value.trim().toUpperCase();
  if (code.length < 2) { $('roomInput').focus(); return; }
  $('roomInput').value = code;
  joinRoom(code);
});
$('roomInput').addEventListener('keydown', (ev) => { if (ev.key === 'Enter') $('startBtn').click(); });
$('nextBtn').addEventListener('click', publishNext);
$('passBtn').addEventListener('click', publishPass);
$('homeBtn').addEventListener('click', leaveRoom);

// 画面上部のミニユウマ（スタート画面の画像を使い回す）
document.querySelectorAll('.yuma-mini').forEach(i => { i.src = document.querySelector('.yuma').src; });

/* =========================================================================
   お題の評価（👍👎）: この端末の localStorage に保存。後で一覧・コピーできる
   ========================================================================= */
const RATE_KEY = 'rate-mimi';
function rateLoad() { try { return JSON.parse(localStorage.getItem(RATE_KEY)) || {}; } catch (e) { return {}; } }
function rateSave(d) { try { localStorage.setItem(RATE_KEY, JSON.stringify(d)); } catch (e) {} }
function currentQuestionText() {
  return (state && typeof state.q === 'number') ? QUESTIONS[state.q][1] : null;
}
function rateUpdate() {
  const t = currentQuestionText(); if (!t) return;
  const r = rateLoad()[t] || { g: 0, b: 0 };
  $('goodN').textContent = r.g; $('badN').textContent = r.b;
}
function rateAdd(kind) {
  const t = currentQuestionText(); if (!t) return;
  const d = rateLoad(); d[t] = d[t] || { g: 0, b: 0 }; d[t][kind]++; rateSave(d); rateUpdate();
  const b = $(kind === 'g' ? 'goodBtn' : 'badBtn'); b.classList.add('flash'); setTimeout(() => b.classList.remove('flash'), 250);
}
function rateRows() {
  const d = rateLoad();
  return Object.keys(d).map(k => ({ t: k, g: d[k].g || 0, b: d[k].b || 0 }))
    .sort((a, b) => (b.b - a.b) || (a.g - b.g) || a.t.localeCompare(b.t, 'ja'));
}
function esc(s) { return String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }
function rateShow() {
  const rows = rateRows();
  $('rateList').innerHTML = rows.length
    ? rows.map(r => '<div class="rate-row"><span>' + esc(r.t) + '</span><span class="cnt"><span class="g">👍' + r.g + '</span><span class="b">👎' + r.b + '</span></span></div>').join('')
    : '<div class="rate-empty">まだ評価がありません</div>';
  showScreen('rate');
}
async function rateCopy() {
  const text = document.title + ' お題評価 ' + new Date().toLocaleDateString('ja-JP') + '\n'
    + rateRows().map(r => '👍' + r.g + ' 👎' + r.b + '  ' + r.t).join('\n');
  try { await navigator.clipboard.writeText(text); $('rateCopyBtn').textContent = 'コピーしました'; }
  catch (e) { window.prompt('長押しでコピーしてください', text); }
  setTimeout(() => { $('rateCopyBtn').textContent = 'テキストをコピー'; }, 1500);
}
function rateReset() { if (confirm('評価をすべて消しますか？')) { rateSave({}); rateShow(); } }
const _renderBase = render;
render = function () { _renderBase(); rateUpdate(); };
$('goodBtn').addEventListener('click', () => rateAdd('g'));
$('badBtn').addEventListener('click', () => rateAdd('b'));
$('rateViewBtn').addEventListener('click', rateShow);
$('rateCopyBtn').addEventListener('click', rateCopy);
$('rateResetBtn').addEventListener('click', rateReset);
$('rateBackBtn').addEventListener('click', () => showScreen('home'));
</script>
</body>
</html>
