<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>この人ならどっち？ 全員一致ゲーム</title>
<style>
  :root{
    --bg1:#fff3e6;
    --bg2:#ffe3d0;
    --ink:#3a2b22;
    --ink-sub:#8a7466;
    --card:#ffffff;
    --accent:#ff8a3d;
    --ok:#1fa971;
    --ok-dark:#147d53;
    --ng:#e8604c;
    --ng-dark:#c04434;
    --pass:#8d8378;
    --pass-dark:#6d645b;
    --shadow:0 4px 0 rgba(0,0,0,.12);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:var(--ink);
    background:linear-gradient(160deg,var(--bg1) 0%,var(--bg2) 100%);
    overflow:hidden;
    touch-action:manipulation;
    -webkit-text-size-adjust:100%;
  }
  #app{
    height:100vh;height:100dvh;
    display:flex;flex-direction:column;
    padding:0 16px calc(14px + env(safe-area-inset-bottom)) 16px;
    max-width:560px;margin:0 auto;
  }
  .screen{flex:1;display:flex;flex-direction:column;min-height:0}
  .hidden{display:none !important}

  /* ---------- ボタン共通 ---------- */
  .btn{
    display:flex;align-items:center;justify-content:center;gap:8px;
    width:100%;border:none;border-radius:16px;
    font-family:inherit;font-weight:800;color:#fff;
    cursor:pointer;box-shadow:var(--shadow);
    transition:transform .06s ease, filter .06s ease;
  }
  .btn:active{transform:translateY(3px);box-shadow:none;filter:brightness(.95)}
  .btn-lg{min-height:68px;font-size:1.35rem;letter-spacing:.04em}
  .btn-start{min-height:80px;font-size:1.6rem;background:var(--accent)}
  .btn-ok{background:var(--ok);border-bottom:4px solid var(--ok-dark)}
  .btn-ng{background:var(--ng);border-bottom:4px solid var(--ng-dark)}
  .btn-pass{background:var(--pass);border-bottom:4px solid var(--pass-dark);min-height:56px;font-size:1.15rem}
  .btn-next{background:var(--accent);border-bottom:4px solid #d96b24;min-height:72px;font-size:1.4rem}
  .btn-icon{font-size:1.5em;line-height:1}

  /* ---------- トップ画面 ---------- */
  #home{justify-content:center;align-items:center;text-align:center;gap:26px;padding-bottom:10px}
  .home-title{font-size:clamp(1.7rem,7.5vw,2.3rem);font-weight:900;line-height:1.35}
  .home-title small{display:block;font-size:.62em;color:var(--accent);margin-bottom:6px}
  .home-lead{
    background:var(--card);border-radius:18px;padding:20px 18px;
    font-size:1.05rem;line-height:1.9;box-shadow:0 3px 12px rgba(0,0,0,.07);
  }
  .home-lead b{color:var(--accent)}
  .home-note{font-size:.85rem;color:var(--ink-sub);line-height:1.7}

  /* ---------- ヘッダー ---------- */
  .bar{
    display:flex;align-items:center;gap:10px;
    padding:calc(10px + env(safe-area-inset-top)) 0 10px 0;
  }
  .home-btn{
    flex:0 0 auto;width:38px;height:38px;border:none;border-radius:12px;
    background:rgba(255,255,255,.85);color:var(--ink-sub);
    font-size:1.1rem;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.08);
  }
  .home-btn:active{transform:translateY(2px)}
  .status{
    flex:1;display:flex;justify-content:flex-end;align-items:baseline;gap:14px;
    font-weight:800;font-size:1.05rem;
  }
  .status .score{color:var(--accent)}

  /* ---------- 問題エリア ---------- */
  .qwrap{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;min-height:0;overflow-y:auto;padding:6px 0}
  .qmeta{text-align:center;font-weight:800;color:var(--ink-sub);font-size:.95rem;letter-spacing:.02em}
  .qmeta .type{
    display:inline-block;background:var(--accent);color:#fff;
    border-radius:999px;padding:3px 12px;margin-right:8px;font-size:.9rem;
  }
  .qtext{
    background:var(--card);border-radius:20px;padding:24px 18px;
    font-size:clamp(1.3rem,5.6vw,1.75rem);font-weight:900;line-height:1.55;
    text-align:center;box-shadow:0 3px 12px rgba(0,0,0,.07);
  }
  .choices{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
  .choice{
    background:#fff;border:2px solid var(--accent);border-radius:14px;
    padding:11px 16px;font-size:clamp(1rem,4.4vw,1.25rem);font-weight:800;color:var(--ink);
  }

  /* ---------- 判定エリア ---------- */
  .actions{display:flex;flex-direction:column;gap:10px;padding-top:8px}
  .verdict{
    text-align:center;background:var(--card);border-radius:18px;padding:18px 14px;
    box-shadow:0 3px 12px rgba(0,0,0,.07);
  }
  .verdict .headline{font-size:1.5rem;font-weight:900;line-height:1.4}
  .verdict .sub{margin-top:6px;font-size:1.05rem;color:var(--ink-sub);font-weight:700}
  .verdict.is-ok .headline{color:var(--ok)}
  .verdict.is-ng .headline{color:var(--ng)}
  .verdict.is-pass .headline{color:var(--pass)}

  /* ---------- 結果画面 ---------- */
  #result{justify-content:center;align-items:center;text-align:center;gap:22px}
  .result-score{font-size:clamp(3.2rem,17vw,4.6rem);font-weight:900;color:var(--accent);line-height:1}
  .result-score span{font-size:.42em;margin-left:4px}
  .result-title{font-size:clamp(1.6rem,7vw,2.1rem);font-weight:900}
  .result-msg{
    background:var(--card);border-radius:18px;padding:18px 16px;
    font-size:1.1rem;line-height:1.8;font-weight:700;box-shadow:0 3px 12px rgba(0,0,0,.07);
  }
  .result-detail{font-size:.9rem;color:var(--ink-sub);line-height:1.8}
</style>
</head>
<body>
<div id="app">

  <!-- ===== トップ画面 ===== -->
  <section id="home" class="screen">
    <h1 class="home-title"><small>この人ならどっち？</small>全員一致ゲーム</h1>
    <p class="home-lead">
      親が何を答えるか、<br>みんなで<b>予想しよう！</b><br>
      1人5問。合計<b>5ポイント以上</b>でクリア！
    </p>
    <button id="startBtn" class="btn btn-start">スタート</button>
    <p class="home-note">答えにくい問題はパスOK<br>理由は言っても言わなくてもOK</p>
  </section>

  <!-- ===== 問題画面 ===== -->
  <section id="game" class="screen hidden">
    <div class="bar">
      <button id="homeBtn" class="home-btn" aria-label="トップにもどる">⌂</button>
      <div class="status">
        <span id="progress">1 / 5問</span>
        <span class="score" id="score">現在0ポイント</span>
      </div>
    </div>

    <div class="qwrap">
      <p class="qmeta"><span class="type" id="qtype">2択</span><span id="qinfo">第1問 / 成功で1ポイント</span></p>
      <p class="qtext" id="qtext"></p>
      <div class="choices" id="qchoices"></div>
    </div>

    <!-- 判定前 -->
    <div class="actions" id="judgeArea">
      <button class="btn btn-lg btn-ok" data-judge="ok"><span class="btn-icon">◎</span>成功</button>
      <button class="btn btn-lg btn-ng" data-judge="ng"><span class="btn-icon">✕</span>失敗</button>
      <button class="btn btn-pass" data-judge="pass"><span class="btn-icon">↷</span>パス</button>
    </div>

    <!-- 判定後 -->
    <div class="actions hidden" id="nextArea">
      <div class="verdict" id="verdict">
        <div class="headline" id="verdictHead"></div>
        <div class="sub" id="verdictSub"></div>
      </div>
      <button id="nextBtn" class="btn btn-next">次の問題へ</button>
    </div>
  </section>

  <!-- ===== 結果画面 ===== -->
  <section id="result" class="screen hidden">
    <div class="result-score" id="resultScore">0<span>ポイント！</span></div>
    <div class="result-title" id="resultTitle"></div>
    <p class="result-msg" id="resultMsg"></p>
    <p class="result-detail" id="resultDetail"></p>
    <button id="backHomeBtn" class="btn btn-start">トップにもどる</button>
  </section>

</div>

/* =========================================================================
   ゲーム本体
   ========================================================================= */

// 出題順と配点
const ORDER  = ['2択', '3択', '4択', '5択', 'フリー'];
const POINTS = { '2択': 1, '3択': 2, '4択': 3, '5択': 4, 'フリー': 5 };
const TOTAL_Q = ORDER.length;
const CLEAR_POINT = 5;

const $ = (id) => document.getElementById(id);

let state = null;

function normalize(entry) {
  return Array.isArray(entry)
    ? { text: entry[0], choices: entry.slice(1) }
    : { text: entry, choices: [] };
}

function startGame() {
  state = {
    step: 0,           // 0〜4（何問目か）
    score: 0,
    used: {},          // 種別ごとに出題済みインデックスを記録（この5問の中だけ）
    current: null
  };
  ORDER.forEach(t => state.used[t] = []);
  showScreen('game');
  nextQuestion();
}

// 同じ5問の中で未出題のものからランダムに1問選ぶ
function pickQuestion(type) {
  const pool = QUESTIONS[type];
  const rest = pool.map((_, i) => i).filter(i => !state.used[type].includes(i));
  if (rest.length === 0) return null;          // 在庫切れ（パスしすぎた場合のみ）
  const idx = rest[Math.floor(Math.random() * rest.length)];
  state.used[type].push(idx);
  return { type: type, index: idx, ...normalize(pool[idx]) };
}

function nextQuestion() {
  const type = ORDER[state.step];
  state.current = pickQuestion(type);
  render();
}

function render() {
  const q = state.current;
  const type = ORDER[state.step];
  const pt = POINTS[type];

  $('progress').textContent = (state.step + 1) + ' / ' + TOTAL_Q + '問';
  $('score').textContent = '現在' + state.score + 'ポイント';
  $('qtype').textContent = type;
  $('qinfo').textContent = '第' + (state.step + 1) + '問 / 成功で' + pt + 'ポイント';
  $('qtext').textContent = q.text;

  const box = $('qchoices');
  box.innerHTML = '';
  q.choices.forEach(c => {
    const el = document.createElement('span');
    el.className = 'choice';
    el.textContent = c;
    box.appendChild(el);
  });

  $('judgeArea').classList.remove('hidden');
  $('nextArea').classList.add('hidden');
}

function judge(kind) {
  const type = ORDER[state.step];
  const pt = POINTS[type];

  // パス：問題数を消費せず、同じ難易度の別問題に差し替える
  if (kind === 'pass') {
    const replacement = pickQuestion(type);
    if (replacement) {
      state.current = replacement;
      render();
      return;
    }
    // その難易度を出しきった場合だけ、パスを1問としてカウントして次へ
    showVerdict('pass', 'パス', 'この難易度は出しきりました');
    return;
  }

  if (kind === 'ok') {
    state.score += pt;
    $('score').textContent = '現在' + state.score + 'ポイント';
    showVerdict('ok', '全員一致！ +' + pt + 'ポイント', '現在' + state.score + 'ポイント！');
  } else {
    showVerdict('ng', '今回は一致せず！', 'なんでそれ選んだの？');
  }
}

function showVerdict(kind, head, sub) {
  const v = $('verdict');
  v.className = 'verdict is-' + kind;
  $('verdictHead').textContent = head;
  $('verdictSub').textContent = sub;
  $('judgeArea').classList.add('hidden');
  $('nextArea').classList.remove('hidden');
  $('nextBtn').textContent = (state.step + 1 >= TOTAL_Q) ? '結果を見る' : '次の問題へ';
}

function advance() {
  state.step++;
  if (state.step >= TOTAL_Q) {
    showResult();
  } else {
    nextQuestion();
  }
}

function showResult() {
  const cleared = state.score >= CLEAR_POINT;
  $('resultScore').innerHTML = state.score + '<span>ポイント！</span>';
  $('resultTitle').textContent = cleared ? 'クリア！' : '惜しい！';
  $('resultMsg').textContent = cleared
    ? 'みんな、けっこう分かってる！'
    : 'まだまだ知らないことがありそう！';
  $('resultDetail').textContent = cleared
    ? CLEAR_POINT + 'ポイント以上でクリアでした'
    : 'あと' + (CLEAR_POINT - state.score) + 'ポイントでクリアでした';
  showScreen('result');
}

function showScreen(name) {
  ['home', 'game', 'result'].forEach(s => {
    $(s).classList.toggle('hidden', s !== name);
  });
}

// ---- イベント ----
$('startBtn').addEventListener('click', startGame);
$('homeBtn').addEventListener('click', () => showScreen('home'));
$('backHomeBtn').addEventListener('click', () => showScreen('home'));
$('nextBtn').addEventListener('click', advance);
document.querySelectorAll('[data-judge]').forEach(btn => {
  btn.addEventListener('click', () => judge(btn.dataset.judge));
});
